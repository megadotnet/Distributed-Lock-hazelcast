# GitHub Actions CI/CD Pipeline for Distributed Lock Application
# Implements: Security Scanning, Testing, Build, and Deployment

name: Production Deployment

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [created]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  JAVA_VERSION: '17'

jobs:
  # ===========================================
  # Stage 1: Security Scanning
  # ===========================================
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Dependency Check (OWASP)
        run: |
          mvn dependency-check:check -DdependencyCheck.failBuild=false || true
        continue-on-error: true

      - name: Run Semgrep Security Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
        continue-on-error: true

      - name: Upload Security Report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif
        continue-on-error: true

  # ===========================================
  # Stage 2: Code Quality & Validation
  # ===========================================
  code-quality:
    name: 📊 Code Quality
    runs-on: ubuntu-latest
    needs: security-scan
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Validate Maven Project
        run: mvn validate

      - name: Check Code Style
        run: mvn checkstyle:check || true
        continue-on-error: true

      - name: SpotBugs Analysis
        run: mvn spotbugs:check || true
        continue-on-error: true

  # ===========================================
  # Stage 3: Testing
  # ===========================================
  test:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality]
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests
        run: mvn test -DskipTests=false
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'

  # ===========================================
  # Stage 4: Build & Package
  # ===========================================
  build:
    name: 🏗️ Build & Package
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    
    outputs:
      version: ${{ steps.version.outputs.version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Get Version from pom.xml
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: distributedlock-app
          path: target/*.jar
          retention-days: 30

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: Build and Push Docker Image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================
  # Stage 5: Deploy to Staging
  # ===========================================
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: staging
      url: https://staging.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: distributedlock-app
          path: ./deploy

      - name: Deploy to Staging Server
        run: |
          echo "Deploying to staging environment..."
          echo "Version: ${{ needs.build.outputs.version }}"
          # Add your staging deployment commands here
          # Example: ssh, kubectl, or cloud-specific deployment
          # ssh -o StrictHostKeyChecking=no user@staging-server "sudo systemctl restart app"
        env:
          DEPLOY_VERSION: ${{ needs.build.outputs.version }}

      - name: Health Check - Staging
        run: |
          echo "Running health checks on staging..."
          # Add your health check commands here
          # curl -f https://staging.example.com/health || exit 1
        timeout-minutes: 5

  # ===========================================
  # Stage 6: Deploy to Production (Manual Approval)
  # ===========================================
  deploy-production:
    name: 🎯 Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: production
      url: https://production.example.com
    permissions:
      contents: read
      deployments: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: distributedlock-app
          path: ./deploy

      - name: Deploy to Production
        run: |
          echo "Deploying to production environment..."
          echo "Version: ${{ needs.build.outputs.version }}"
          # Add your production deployment commands here
          # Example: Blue-green deployment with Kubernetes
          # kubectl set image deployment/app app=ghcr.io/${{ github.repository }}:${{ github.sha }}
          # kubectl rollout status deployment/app
        env:
          DEPLOY_VERSION: ${{ needs.build.outputs.version }}

      - name: Production Health Check
        run: |
          echo "Running production health checks..."
          # Add your production health check commands here
          # curl -f https://production.example.com/health || exit 1
        timeout-minutes: 5

      - name: Create Deployment Record
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              description: 'Deployed version ${{ needs.build.outputs.version }}',
              auto_merge: false,
              required_contexts: []
            });

      - name: Notify Deployment Success
        if: success()
        run: |
          echo "✅ Production deployment successful!"
          echo "Version: ${{ needs.build.outputs.version }}"
          echo "Commit: ${{ github.sha }}"

  # ===========================================
  # Stage 7: Automated Rollback (On Failure)
  # ===========================================
  rollback:
    name: 🔄 Automated Rollback
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: failure() && (needs.deploy-staging.result == 'failure' || needs.deploy-production.result == 'failure')
    
    steps:
      - name: Trigger Rollback
        run: |
          echo "🚨 Deployment failed! Initiating rollback..."
          # Add your rollback commands here
          # Example: kubectl rollout undo deployment/app
          # Example: Switch traffic back to previous version
          echo "Rollback completed."
